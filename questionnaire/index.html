<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>悦单词问卷调查</title>
  <style>
    :root {
      --bg: #eef3fb;
      --panel: #fff7fb;
      --ink: #30293d;
      --muted: #756b86;
      --line: #ead8e8;
      --blue: #456ea8;
      --blue-soft: #dce9ff;
      --pink: #ff8fbd;
      --pink-soft: #ffd7e8;
      --green: #3c8d70;
      --green-soft: #dff4e9;
      --danger: #b75c68;
      --shadow: 0 18px 44px rgba(49, 42, 72, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.68), rgba(238, 243, 251, 0.9)),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 22px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(1080px, 100%);
      min-height: calc(100vh - 60px);
      border: 2px solid #f3c5d9;
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 22px 16px;
      background: linear-gradient(180deg, #fff0f7, #ffe0ec);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .status-pill {
      justify-self: end;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      padding: 8px 10px;
      border: 1px solid #f0cfe1;
      white-space: nowrap;
    }

    .content {
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
      gap: 14px;
      align-items: start;
    }

    .section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label,
    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .required-mark,
    .required-note {
      color: var(--danger);
      font-weight: 900;
    }

    .required-note {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .field.invalid select,
    .field.invalid textarea {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(183, 92, 104, 0.13);
    }

    .field.invalid .choice {
      border-color: #d99aa5;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #dcc9dd;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
      padding: 10px 11px;
      line-height: 1.35;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(69, 110, 168, 0.14);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .choice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      min-height: 36px;
      padding: 0 13px;
      border-radius: 8px;
      color: var(--ink);
      background: #f6f1f7;
      border: 1px solid #e0cede;
      font-size: 13px;
      font-weight: 700;
    }

    .choice.selected {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: #24466f;
    }

    .aside {
      display: grid;
      gap: 14px;
      position: sticky;
      top: 18px;
    }

    .summary-panel {
      border-color: #c7e6d7;
      background: var(--green-soft);
    }

    .summary-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.82);
      padding: 9px;
      min-height: 58px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .user-card {
      grid-column: 1 / -1;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.82);
      padding: 9px;
      min-height: 58px;
    }

    .user-name {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .user-status {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .message {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 10px 0 0;
    }

    .message.error {
      color: var(--danger);
      font-weight: 700;
    }

    .message.success {
      color: var(--green);
      font-weight: 700;
    }

    .submit-hint {
      align-self: center;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .submit-hint.ready {
      color: var(--green);
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      padding: 12px 18px 16px;
      background: #fff0f7;
      border-top: 1px solid var(--line);
    }

    .ghost-button,
    .secondary-button,
    .submit-button {
      min-height: 40px;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 800;
    }

    .ghost-button {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--line);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .secondary-button {
      background: var(--blue-soft);
      color: #24466f;
      border: 1px solid #bdd2ef;
    }

    .submit-button {
      background: var(--blue);
      color: #fff;
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
      }

      .page {
        min-height: calc(100vh - 36px);
      }

      .header {
        grid-template-columns: 1fr;
        padding: 14px 14px 10px;
      }

      .status-pill {
        justify-self: start;
      }

      h1 {
        font-size: 21px;
      }

      .content {
        display: block;
        padding: 12px;
      }

      .form,
      .aside {
        display: block;
      }

      .section {
        margin-bottom: 12px;
      }

      .aside {
        position: static;
      }
    }

    @media (max-width: 520px) {
      .grid-2,
      .summary-metrics,
      .footer {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="title">
        <h1>悦单词问卷调查</h1>
      </div>
      <div class="status-pill" id="headerStatus">待填写</div>
    </header>

    <div class="content">
      <form class="form" id="questionnaireForm" autocomplete="off">
        <p class="required-note"><span class="required-mark">*</span> 为必填项目</p>
        <section class="section">
          <h2 class="section-title">基础信息</h2>
          <div class="field" id="provinceField">
            <label for="provinceSelect">所在地区 <span class="required-mark">*</span></label>
            <select id="provinceSelect">
              <option value="">请选择地区</option>
            </select>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">个人资料</h2>
          <div class="field" id="genderField">
            <div class="field-label">性别 <span class="required-mark">*</span></div>
            <div class="choice-grid" id="genderChoices"></div>
          </div>
          <div class="field" id="degreeField">
            <div class="field-label">学历 <span class="required-mark">*</span></div>
            <div class="choice-grid" id="degreeChoices"></div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">反馈建议</h2>
          <div class="field" id="suggestionField">
            <label for="suggestionInput">建议内容 <span class="required-mark">*</span></label>
            <textarea id="suggestionInput" maxlength="1000" placeholder="写下你对学习流程、词库、对战体验或界面的建议"></textarea>
          </div>
        </section>
      </form>

      <aside class="aside">
        <section class="section summary-panel">
          <h2 class="section-title">填写状态</h2>
          <div class="summary-metrics">
            <div class="user-card">
              <div class="user-name" id="userName">微信用户</div>
              <div class="user-status" id="summaryIdentity">待识别</div>
            </div>
            <div class="metric">
              <div class="metric-label">地区</div>
              <div class="metric-value" id="summaryProvince">未选择</div>
            </div>
            <div class="metric">
              <div class="metric-label">性别</div>
              <div class="metric-value" id="summaryGender">未选择</div>
            </div>
            <div class="metric">
              <div class="metric-label">学历</div>
              <div class="metric-value" id="summaryDegree">未选择</div>
            </div>
          </div>
          <p class="message" id="formMessage">请填写所有必填项后提交问卷。</p>
        </section>

      </aside>
    </div>

    <footer class="footer">
      <a class="ghost-button" href="../">返回</a>
      <button type="button" class="secondary-button" id="resetButton">清空</button>
      <button type="button" class="submit-button" id="submitButton">提交问卷</button>
      <div class="submit-hint" id="submitHint">请填写所有必填项</div>
    </footer>
  </main>

  <script src="../shared/app.js"></script>
  <script>
    const surveyVersion = "v1.0";
    const genderOptions = ["男", "女"];
    const degreeOptions = ["小学", "初中", "高中", "本科", "硕士", "博士"];
    const provinceOptions = [
      "北京", "天津", "河北", "山西", "内蒙古", "辽宁", "吉林", "黑龙江",
      "上海", "江苏", "浙江", "安徽", "福建", "江西", "山东", "河南", "湖北",
      "湖南", "广东", "广西", "海南", "重庆", "四川", "贵州", "云南", "西藏",
      "陕西", "甘肃", "青海", "宁夏", "新疆", "台湾", "香港", "澳门"
    ];

    const state = {
      gender: "",
      degree: "",
      status: "待填写"
    };

    const elements = {
      form: document.getElementById("questionnaireForm"),
      provinceSelect: document.getElementById("provinceSelect"),
      suggestionInput: document.getElementById("suggestionInput"),
      genderChoices: document.getElementById("genderChoices"),
      degreeChoices: document.getElementById("degreeChoices"),
      provinceField: document.getElementById("provinceField"),
      genderField: document.getElementById("genderField"),
      degreeField: document.getElementById("degreeField"),
      suggestionField: document.getElementById("suggestionField"),
      headerStatus: document.getElementById("headerStatus"),
      userName: document.getElementById("userName"),
      summaryIdentity: document.getElementById("summaryIdentity"),
      summaryProvince: document.getElementById("summaryProvince"),
      summaryGender: document.getElementById("summaryGender"),
      summaryDegree: document.getElementById("summaryDegree"),
      formMessage: document.getElementById("formMessage"),
      resetButton: document.getElementById("resetButton"),
      submitButton: document.getElementById("submitButton"),
      submitHint: document.getElementById("submitHint")
    };

    function createChoice(label, group, onSelect) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.textContent = label;
      button.dataset.group = group;
      button.dataset.value = label;
      button.addEventListener("click", () => onSelect(label));
      return button;
    }

    function renderInitialOptions() {
      provinceOptions.forEach(province => {
        const option = document.createElement("option");
        option.value = province;
        option.textContent = province;
        elements.provinceSelect.appendChild(option);
      });

      genderOptions.forEach(gender => {
        elements.genderChoices.appendChild(createChoice(gender, "gender", value => {
          state.gender = value;
          setStatus("填写中");
          update();
        }));
      });

      degreeOptions.forEach(degree => {
        elements.degreeChoices.appendChild(createChoice(degree, "degree", value => {
          state.degree = value;
          setStatus("填写中");
          update();
        }));
      });
    }

    function readLinkIdentity() {
      return window.WannaEnglishH5.readIdentity();
    }

    function buildPayload() {
      const identity = readLinkIdentity();
      return {
        userID: identity.userID,
        userName: identity.userName,
        surveyVersion,
        gender: state.gender,
        province: elements.provinceSelect.value,
        degree: state.degree,
        suggestion: elements.suggestionInput.value.trim()
      };
    }

    function getValidationError(payload) {
      if (!Number.isInteger(payload.userID) || payload.userID <= 0) {
        return { field: null, message: "缺少链接身份，请从游戏内入口打开问卷。" };
      }
      if (!payload.province) {
        return { field: "province", message: "请选择所在地区。" };
      }
      if (!payload.gender) {
        return { field: "gender", message: "请选择性别。" };
      }
      if (!payload.degree) {
        return { field: "degree", message: "请选择学历。" };
      }
      if (!payload.suggestion) {
        return { field: "suggestion", message: "请填写建议内容。" };
      }
      return null;
    }

    function clearInvalidFields() {
      elements.provinceField.classList.remove("invalid");
      elements.genderField.classList.remove("invalid");
      elements.degreeField.classList.remove("invalid");
      elements.suggestionField.classList.remove("invalid");
    }

    function markInvalidField(fieldName) {
      clearInvalidFields();
      const fieldMap = {
        province: elements.provinceField,
        gender: elements.genderField,
        degree: elements.degreeField,
        suggestion: elements.suggestionField
      };
      const target = fieldMap[fieldName];
      if (target) {
        target.classList.add("invalid");
      }
    }

    function focusMissingField(fieldName) {
      markInvalidField(fieldName);
      const focusMap = {
        province: elements.provinceSelect,
        gender: elements.genderField,
        degree: elements.degreeField,
        suggestion: elements.suggestionInput
      };
      const target = focusMap[fieldName];
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        if (typeof target.focus === "function") {
          target.focus({ preventScroll: true });
        }
      }
    }

    function updateChoiceStates() {
      elements.genderChoices.querySelectorAll(".choice").forEach(button => {
        button.classList.toggle("selected", button.dataset.value === state.gender);
      });
      elements.degreeChoices.querySelectorAll(".choice").forEach(button => {
        button.classList.toggle("selected", button.dataset.value === state.degree);
      });
    }

    function setStatus(message, type = "") {
      state.status = message;
      elements.headerStatus.textContent = message;
      elements.formMessage.textContent = message;
      elements.formMessage.classList.toggle("error", type === "error");
      elements.formMessage.classList.toggle("success", type === "success");
    }

    function update() {
      const payload = buildPayload();
      const error = getValidationError(payload);
      elements.userName.textContent = payload.userName || "微信用户";
      const identity = readLinkIdentity();
      elements.summaryIdentity.textContent = payload.userID > 0
        ? `${identity.isLocalFallback ? "本地测试用户" : "用户"} ${payload.userID}`
        : "待识别";
      elements.summaryProvince.textContent = payload.province || "未选择";
      elements.summaryGender.textContent = payload.gender || "未选择";
      elements.summaryDegree.textContent = payload.degree || "未选择";
      elements.submitHint.textContent = error ? "请填写所有必填项" : "可以提交";
      elements.submitHint.classList.toggle("ready", !error);
      updateChoiceStates();

      if (state.status === "待填写" || state.status === "填写中") {
        setStatus(error ? "请填写所有必填项后提交问卷" : "可提交", error ? "error" : "");
      }
    }

    async function submitPreview() {
      const payload = buildPayload();
      const error = getValidationError(payload);
      if (error) {
        setStatus(error.message, "error");
        update();
        focusMissingField(error.field);
        return;
      }

      clearInvalidFields();
      elements.submitButton.disabled = true;
      setStatus("正在提交问卷...");
      try {
        const response = await fetch(`${window.WannaEnglishH5.getApiBaseUrl()}/questionnaire/submit`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.error) {
          throw new Error(result.error || "提交失败");
        }
        setStatus("问卷已提交", "success");
      } catch (error) {
        setStatus(`提交失败：${error.message || "请稍后重试"}`, "error");
      } finally {
        elements.submitButton.disabled = false;
      }
    }

    function resetForm() {
      elements.form.reset();
      state.gender = "";
      state.degree = "";
      setStatus("待填写");
      update();
    }

    renderInitialOptions();
    readLinkIdentity();
    elements.provinceSelect.addEventListener("change", () => {
      setStatus("填写中");
      update();
    });
    elements.suggestionInput.addEventListener("input", () => {
      setStatus("填写中");
      update();
    });
    elements.resetButton.addEventListener("click", resetForm);
    elements.submitButton.addEventListener("click", submitPreview);
    update();
  </script>
</body>
</html>
