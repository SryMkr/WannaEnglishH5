<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WannaEnglish 玩家中心</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #30293d;
      background: #eef3fb;
      display: flex;
      justify-content: center;
      padding: 18px;
    }
    main {
      width: min(430px, 100%);
      background: #fff7fb;
      border: 2px solid #f3c5d9;
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(49, 42, 72, 0.18);
      padding: 18px;
      align-self: center;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 18px; color: #756b86; line-height: 1.55; }
    .links { display: grid; gap: 12px; }
    a {
      display: block;
      text-decoration: none;
      color: #24466f;
      background: #dce9ff;
      border: 1px solid #bdd2ef;
      border-radius: 10px;
      padding: 14px;
      font-weight: 800;
    }
    small { display: block; margin-top: 5px; color: #756b86; font-weight: 500; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <h1>WannaEnglish 玩家中心</h1>
    <p>这里先承载外部 H5 表单。后续会通过游戏生成的 token 识别玩家身份，并调用现有 WannaEnglishserver 后端。</p>
    <div class="links">
      <a href="./questionnaire/">填写问卷<small>迁移游戏内问卷表单的入口占位</small></a>
      <a href="./vocabulary-contribution/">词条贡献<small>录入新词、纠错词条、查看审核状态</small></a>
    </div>
  </main>
</body>
</html>
