<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>悦单词玩家中心</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #30293d;
      background: #eef3fb;
      display: flex;
      justify-content: center;
      padding: 32px 22px;
    }
    main {
      width: min(960px, 100%);
      background: #fff7fb;
      border: 2px solid #f3c5d9;
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(49, 42, 72, 0.18);
      padding: 26px;
      align-self: center;
    }
    h1 { margin: 0 0 24px; font-size: 30px; }
    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    a {
      display: block;
      text-decoration: none;
      color: #24466f;
      background: #dce9ff;
      border: 1px solid #bdd2ef;
      border-radius: 10px;
      padding: 18px;
      font-weight: 800;
      min-height: 104px;
    }
    small { display: block; margin-top: 5px; color: #756b86; font-weight: 500; line-height: 1.4; }
    @media (max-width: 640px) {
      body { padding: 18px; }
      main { padding: 18px; }
      h1 { font-size: 24px; }
      .links { grid-template-columns: 1fr; }
      a { min-height: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>悦单词玩家中心</h1>
    <div class="links">
      <a href="./questionnaire/" data-user-link>填写问卷</a>
      <a href="./vocabulary-contribution/" data-user-link>词条贡献<small>录入新词、纠错词条、查看审核状态</small></a>
    </div>
  </main>
  <script src="./shared/app.js"></script>
  <script>
    const identity = window.WannaEnglishH5.readIdentity();
    document.querySelectorAll("[data-user-link]").forEach(link => {
      link.href = window.WannaEnglishH5.appendIdentityToUrl(link.getAttribute("href"), identity);
    });
  </script>
</body>
</html>
